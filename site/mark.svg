<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="">
  <!-- Inline header mark: no tile, strokes inherit the page's text colour so it works
       in both light and dark mode. The dark tiled version is logo.svg, for the favicon. -->
